# fly.toml app configuration file generated for meta-corpus-web-app on 2026-07-08T21:37:57-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'meta-corpus-web-app'
primary_region = 'ewr'
console_command = 'python backend/manage.py shell'

[build]
[env]
  DATA_DIR = '/data'
  DJANGO_SETTINGS_MODULE = 'config.settings.production'
  PORT = '8000'

[[mounts]]
  source = 'meta_corpus_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
